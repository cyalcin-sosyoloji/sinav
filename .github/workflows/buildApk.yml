name: APK derle
# Yalnızca elle çalışır: Actions > APK derle > Run workflow.
# index.html değişince APK'yı yeniden yapmaya gerek yok; APK siteyi doğrudan açar.
on:
  workflow_dispatch:

env:
  SITE_URL: https://cyalcin-sosyoloji.github.io/sinav/index.html

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Capacitor projesini hazırla
        run: |
          mkdir -p apk/www && cd apk
          cat > package.json <<'JSON'
          {
            "name": "sinav-apk",
            "private": true,
            "version": "1.0.0",
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/camera": "^6.0.0",
              "@capacitor/cli": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            }
          }
          JSON
          cat > capacitor.config.json <<JSON
          {
            "appId": "com.dersapp.sinav",
            "appName": "Çevrimdışı Sınav",
            "webDir": "www",
            "server": {
              "url": "$SITE_URL",
              "allowNavigation": ["cyalcin-sosyoloji.github.io"],
              "errorPath": "error.html"
            }
          }
          JSON
          cat > www/index.html <<HTML
          <!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Çevrimdışı Sınav</title>
          <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0E1621;color:#E8EDF3;font-family:system-ui,sans-serif;text-align:center;padding:24px}
          button{margin-top:16px;background:#F5B357;color:#0E1621;border:0;border-radius:14px;height:48px;padding:0 24px;font-size:15px;font-weight:600}p{color:#A9B6C6;max-width:320px;line-height:1.5}</style></head>
          <body><div><h1 style="font-size:22px;margin:0 0 8px">İnternet gerekli</h1><p>Uygulama ilk kez açılırken internete bağlanıp sayfayı indirmelidir. Bundan sonra internetsiz de çalışır.</p>
          <button type="button" onclick="location.href='$SITE_URL'">Tekrar dene</button></div></body></html>
          HTML
          cp www/index.html www/error.html

      - name: Bağımlılıkları kur ve Android projesini oluştur
        working-directory: apk
        run: |
          npm install
          npx cap add android

      - name: Kamera izni
        working-directory: apk
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          grep -n CAMERA $M

      - name: Yazdırma köprüsü (Android yazdır / PDF kaydet)
        working-directory: apk
        run: |
          D=android/app/src/main/java/com/dersapp/sinav
          cat > $D/PrintBridge.java <<'JAVA'
          package com.dersapp.sinav;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintDocumentAdapter;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "PrintBridge")
          public class PrintBridge extends Plugin {
            @PluginMethod
            public void print(final PluginCall call) {
              final String title = call.getString("title", "Evrak");
              getActivity().runOnUiThread(() -> {
                try {
                  WebView wv = getBridge().getWebView();
                  PrintManager pm = (PrintManager) getActivity().getSystemService(Context.PRINT_SERVICE);
                  PrintDocumentAdapter a = wv.createPrintDocumentAdapter(title);
                  pm.print(title, a, new PrintAttributes.Builder().build());
                  call.resolve();
                } catch (Exception e) {
                  call.reject(String.valueOf(e.getMessage()));
                }
              });
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.dersapp.sinav;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(PrintBridge.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
          ls $D

      - name: Senkronla ve APK derle
        working-directory: apk
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sinav-offline-apk
          path: apk/android/app/build/outputs/apk/debug/app-debug.apk
